name: Update PoE Dictionary

on:
  schedule:
    - cron: '0 0 * * 0' # 毎週日曜日に全自動実行
  workflow_dispatch: # Actions画面から手動実行できるボタン

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリの読み込み
        uses: actions/checkout@v4

      - name: Node.js のセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 統合辞書の自動生成実行 (API + PoEDB/RePoE)
        run: node generate_dict.js

      - name: 生成結果を保存して自動コミット
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]"
          git add dictionary.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dictionary (API + RePoE/PoEDB)" && git push)
