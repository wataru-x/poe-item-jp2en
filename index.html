<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PoE Item JP to EN Converter</title>
  <style>
    body { font-family: sans-serif; max-width: 950px; margin: 20px auto; padding: 0 20px; background: #1a1a1a; color: #e0e0e0; }
    h1 { color: #af9456; text-align: center; margin-bottom: 5px; }
    p { text-align: center; color: #aaa; font-size: 14px; }
    .status { text-align: center; color: #4caf50; font-size: 12px; margin-bottom: 10px; }
    .container { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px; }
    .box { flex: 1; min-width: 320px; display: flex; flex-direction: column; }
    label { font-weight: bold; margin-bottom: 8px; color: #af9456; }
    textarea { height: 420px; background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 12px; font-family: monospace; font-size: 13px; resize: vertical; box-sizing: border-box; }
    button { display: block; width: 100%; margin: 20px 0; padding: 14px; font-size: 18px; background: #af9456; color: #000; font-weight: bold; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background: #cbb274; }
  </style>
</head>
<body>

  <h1>PoE 日本語 ➔ 英語 アイテム変換器 (PoB対応版)</h1>
  <div id="status" class="status">辞書データ読み込み中...</div>

  <div class="container">
    <div class="box">
      <label for="input">日本語データ (Ctrl+V)</label>
      <textarea id="input" placeholder="アイテムクラス: 手袋..."></textarea>
    </div>

    <div class="box">
      <label for="output">英語データ (PoBインポート用)</label>
      <textarea id="output" readonly placeholder="Item Class: Gloves..."></textarea>
    </div>
  </div>

  <button onclick="convertItem()">英語に変換する</button>

  <script src="app.js"></script>
</body>
</html>
